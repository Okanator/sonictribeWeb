# Urejevalnik vsebine SonicTribe (Decap CMS)
# Prijava poteka z GitHub računom, ki ima dostop do repozitorija.
backend:
  name: github
  repo: Okanator/sonictribeWeb
  branch: main
  commit_messages:
    create: 'Nov vnos: {{collection}} „{{slug}}“'
    update: 'Posodobitev: {{collection}} „{{slug}}“'
    delete: 'Izbris: {{collection}} „{{slug}}“'
    uploadMedia: 'Nalaganje: {{path}}'
    deleteMedia: 'Izbris datoteke: {{path}}'

site_url: https://www.sonictribe.net
display_url: https://www.sonictribe.net
logo_url: /img/brand/sonictribe-logo-black.png

media_folder: src/img/uploads
public_folder: /img/uploads

collections:
  - name: dosezki
    label: Skupaj smo ustvarili (dosežki)
    label_singular: Dosežek
    description: Koncerti, izidi, kampanje … Najnovejši (po datumu za razvrščanje) so na vrhu.
    folder: src/content/dosezki
    create: true
    slug: '{{slug}}'
    sortable_fields: ['razvrscanje', 'title']
    summary: '{{datum}} · {{kategorija}} · {{title}}'
    fields:
      - { name: title, label: Naslov, widget: string }
      - { name: velik_napis, label: Velik napis na kartici, widget: string, required: false, hint: 'npr. »Križanke«' }
      - { name: datum, label: Datum (kot se izpiše), widget: string, hint: 'npr. 17. 9. 2026 ali 2026' }
      - { name: razvrscanje, label: Datum za razvrščanje, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD. MM. YYYY', time_format: false }
      - { name: kategorija, label: Kategorija, widget: select, options: ['Koncert', 'Izid', 'Kampanja', 'Drugo'] }
      - { name: izvajalec, label: Izvajalec, widget: string }
      - { name: opis, label: Kratek opis, widget: string, required: false }
      - { name: poziv, label: Poziv na kartici, widget: string, required: false, hint: 'npr. »več odra« (izpiše se kot ▶ VEČ ODRA)' }
      - { name: fotografija, label: Fotografija, widget: image, required: false }
      - { name: izpostavljeno, label: Izpostavljeno, widget: boolean, required: false, default: false }
      - { name: izhodisce, label: Izhodišče, widget: markdown, required: false, buttons: ['bold', 'italic', 'link'] }
      - { name: ideja, label: Ideja, widget: markdown, required: false, buttons: ['bold', 'italic', 'link'] }
      - { name: izvedba, label: Izvedba, widget: markdown, required: false, buttons: ['bold', 'italic', 'link'] }

  - name: videospoti
    label: Videospoti
    label_singular: Videospot
    description: Na prvi strani se prikaže 6 najnovejših.
    folder: src/content/videospoti
    create: true
    slug: '{{slug}}'
    sortable_fields: ['datum', 'title']
    summary: '{{datum}} · {{izvajalec}} – {{title}}'
    fields:
      - { name: title, label: Naslov skladbe, widget: string }
      - { name: izvajalec, label: Izvajalec, widget: string }
      - { name: youtube, label: YouTube povezava, widget: string, hint: 'npr. https://www.youtube.com/watch?v=…' }
      - { name: datum, label: Datum objave, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD. MM. YYYY', time_format: false }

  - name: izdelki
    label: Trgovina
    label_singular: Izdelek
    description: Gumb »Kupi« vodi v SumUp trgovino.
    folder: src/content/izdelki
    create: true
    slug: '{{slug}}'
    sortable_fields: ['vrstni_red', 'title']
    summary: '{{vrstni_red}}. {{title}} – {{cena}}'
    fields:
      - { name: title, label: Ime izdelka, widget: string }
      - { name: format, label: Format, widget: string, hint: 'npr. Vinil, CD, Merch · več velikosti' }
      - { name: cena, label: Cena, widget: string, hint: 'npr. 30,00 €' }
      - { name: sumup, label: SumUp povezava, widget: string }
      - { name: slika, label: Slika, widget: image, required: false }
      - { name: vrstni_red, label: Vrstni red, widget: number, value_type: int, default: 99 }

  - name: izvajalci
    label: Izvajalci
    label_singular: Izvajalec
    folder: src/content/izvajalci
    create: true
    slug: '{{slug}}'
    summary: '{{vrstni_red}}. {{title}}'
    fields:
      - { name: title, label: Ime, widget: string }
      - { name: podnaslov, label: Podnaslov, widget: string, required: false }
      - { name: fotografija, label: Fotografija, widget: image }
      - { name: fokus, label: Izrez fotografije, widget: string, required: false, hint: 'kateri del fotografije ostane viden, npr. »50% 40%« (vodoravno, navpično)' }
      - { name: vrstni_red, label: Vrstni red, widget: number, value_type: int, default: 99 }
      - { name: body, label: O izvajalcu, widget: markdown, buttons: ['bold', 'italic', 'link'] }
      - { name: spotify, label: Spotify, widget: string, required: false }
      - { name: apple_music, label: Apple Music, widget: string, required: false }
      - { name: youtube, label: YouTube, widget: string, required: false }
      - { name: deezer, label: Deezer, widget: string, required: false }
      - { name: instagram, label: Instagram, widget: string, required: false }
      - { name: facebook, label: Facebook, widget: string, required: false }
      - { name: tiktok, label: TikTok, widget: string, required: false }
      - { name: spletna_stran, label: Spletna stran, widget: string, required: false }
      - { name: booking, label: Booking e-pošta, widget: string, default: 'booking@sonictribe.net' }

  - name: radio
    label: Radio
    label_singular: Skladba
    description: >-
      Skladbe za SonicTribe Radio. Naloži MP3 (priporočeno 192 kbps) in vpiši naslov ter izvajalca –
      trajanje, album, leto, naslovnica ter povezavi na Apple Music in Deezer se v nekaj minutah dopolnijo same. Za Spotify, YouTube in Tidal prilepi povezavo, sicer gumb odpre iskanje skladbe.
      Kar vpišeš sam, ima prednost. WAV/AIFF/FLAC najprej pretvori v MP3: sonictribe.net/admin/pretvornik.html
    folder: src/content/radio
    create: true
    slug: '{{fields.izvajalec}}-{{fields.title}}'
    sortable_fields: ['izvajalec', 'title', 'leto']
    summary: '{{izvajalec}} – {{title}}'
    fields:
      - { name: datoteka, label: Zvočna datoteka (MP3 ali M4A), widget: file, media_folder: /src/audio, public_folder: /audio, hint: 'MP3 ali M4A, priporočeno 192 kbps (≈ 7 MB za 4 minute)' }
      - { name: title, label: Naslov skladbe, widget: string }
      - { name: izvajalec, label: Izvajalec, widget: string }
      - { name: album, label: Album, widget: string, required: false, hint: 'pusti prazno – dopolni se samo' }
      - { name: leto, label: Leto, widget: string, required: false, hint: 'pusti prazno – dopolni se samo' }
      - { name: naslovnica, label: Naslovnica, widget: image, required: false, hint: 'pusti prazno – vzame se iz MP3 ali Apple Music' }
      - { name: aktivno, label: Na sporedu, widget: boolean, default: true }
      - { name: spotify, label: Spotify, widget: string, required: false }
      - { name: apple_music, label: Apple Music, widget: string, required: false }
      - { name: youtube, label: YouTube, widget: string, required: false }
      - { name: deezer, label: Deezer, widget: string, required: false }
      - { name: tidal, label: Tidal, widget: string, required: false }
      - { name: trajanje, label: 'Trajanje (sekunde, samodejno)', widget: number, value_type: float, required: false }
      - { name: povezave_iskane, label: 'Povezave že iskane (izklopi za ponovno iskanje)', widget: boolean, required: false, default: false }

  - name: nastavitve
    label: Nastavitve strani
    editor: { preview: false }
    files:
      - name: site
        label: Splošno, kontakt in radio
        file: src/_data/site.json
        fields:
          - { name: ime, label: Ime, widget: hidden }
          - { name: url, label: Naslov strani, widget: hidden }
          - { name: seo_naslov, label: Naslov strani (Google), widget: string }
          - { name: seo_opis, label: Opis strani (Google), widget: text }
          - { name: trditev, label: 'Kratka trditev (trenutno ni prikazana)', widget: string, required: false }
          - { name: opis, label: 'Prvi razdelek – besedilo pod velikim napisom', widget: text }
          - label: 'Prvi razdelek'
            name: uvod
            widget: object
            fields:
              - { name: naslov, label: Velik napis, widget: string }
              - { name: slika, label: Fotografija v ozadju, widget: image }
              - { name: gumb_dogodek, label: 'Gumb 1 (vodi na 1. storitev)', widget: string }
              - { name: gumb_kampanja, label: 'Gumb 2 (vodi na 2. storitev)', widget: string }
          - label: 'Kaj delamo – storitve'
            name: storitve
            widget: list
            summary: '{{naslov}}'
            fields:
              - { name: naslov, label: Naslov, widget: string }
              - { name: opis, label: Opis, widget: text }
              - { name: gumb, label: Besedilo povezave, widget: string }
              - { name: email, label: E-naslov, widget: string }
              - { name: zadeva, label: Zadeva e-pošte, widget: string }
              - { name: slika, label: Fotografija, widget: image }
              - { name: fokus, label: Izrez fotografije, widget: string, required: false, hint: 'npr. »50% 40%«' }
          - { name: partnerji, label: 'Sodelovali smo z (diskretna vrstica na dnu)', widget: list, field: { name: ime, label: Ime, widget: string } }
          - { name: radio_nowplaying_url, label: 'Radio – AzuraCast »now playing« API', widget: string, required: false, hint: 'npr. https://radio.sonictribe.net/api/nowplaying/sonictribe' }
          - { name: radio_stream_url, label: 'Radio – naslov pretoka (stream)', widget: string, required: false }
          - label: Kontakt
            name: kontakt
            widget: object
            fields:
              - { name: naslov, label: Naslov razdelka, widget: string }
              - { name: podjetje, label: Podjetje, widget: string }
              - { name: vrstice, label: Podatki (vsaka vrstica posebej), widget: list, field: { name: vrstica, label: Vrstica, widget: string } }
              - { name: email, label: Splošni e-naslov, widget: string }
          - label: Ekipa
            name: ekipa
            widget: list
            summary: '{{vloga}} – {{ime}}'
            fields:
              - { name: vloga, label: Vloga, widget: string }
              - { name: ime, label: Ime, widget: string }
              - { name: email, label: E-naslov, widget: string }
              - { name: telefon, label: Telefon, widget: string, required: false }
          - label: Socialna omrežja
            name: socialna_omrezja
            widget: object
            fields:
              - { name: facebook, label: Facebook, widget: string }
              - { name: instagram, label: Instagram, widget: string }
              - { name: youtube, label: YouTube, widget: string }
